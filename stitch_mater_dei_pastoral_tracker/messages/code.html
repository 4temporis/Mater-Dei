<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b365d" />
  <title>Messages — Mater Dei Pastoral Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/tailwind.css" />
</head>
<body class="min-h-screen bg-parchment font-sans text-on-surface antialiased pb-24">
  <header class="sticky top-0 z-40 bg-white border-b border-parchment-outline shadow-sm">
    <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
      <a href="../index.html" class="flex items-center gap-2 min-w-0">
        <span class="material-symbols-outlined text-primary text-2xl">church</span>
        <div class="min-w-0">
          <h1 class="font-serif text-sm font-bold text-primary leading-tight truncate">Parish Messages</h1>
          <p class="text-[11px] text-secondary leading-tight truncate">From the parish office</p>
        </div>
      </a>
      <button id="markAllBtn" class="text-xs font-semibold text-secondary hover:text-primary px-2 py-1 rounded-lg hover:bg-surface-container whitespace-nowrap">
        Mark all read
      </button>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-4 space-y-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full bg-primary text-white flex items-center justify-center text-xs font-bold" data-session-initials>–</div>
        <div>
          <p class="text-xs font-bold text-primary" data-session-name>Loading…</p>
          <p class="text-[10px] text-on-surface-variant" data-session-role>Minister</p>
        </div>
      </div>
      <span id="unreadPill" class="text-[11px] font-semibold text-on-surface-variant bg-parchment-container px-2.5 py-1 rounded-full">–</span>
    </div>

    <div id="emptyBox" class="hidden bg-white rounded-xl p-8 text-center border border-parchment-outline">
      <span class="material-symbols-outlined text-4xl text-outline-variant">mark_email_read</span>
      <h2 class="font-serif text-lg font-bold text-primary mt-2">No messages yet</h2>
      <p class="text-sm text-on-surface-variant mt-1">When the parish office sends a message, it will appear here.</p>
      <a data-admin-only href="../admin_sunday_visit_roster/code.html#messages" class="hidden inline-flex items-center gap-1 mt-4 px-4 py-2.5 rounded-lg bg-primary text-white text-sm font-semibold">
        <span class="material-symbols-outlined text-base">edit</span>Send a message
      </a>
    </div>

    <div id="messageList" class="space-y-2.5">
      <div class="bg-white rounded-xl p-6 text-center border border-parchment-outline text-sm text-on-surface-variant">
        Loading messages…
      </div>
    </div>
  </main>

  <nav class="fixed bottom-0 inset-x-0 z-50 bg-white border-t border-parchment-outline shadow-[0_-4px_16px_rgba(27,54,93,0.06)] safe-bottom">
    <div class="max-w-xl mx-auto flex items-stretch justify-around px-1 py-1.5">
      <a href="../index.html" class="flex flex-col items-center justify-center gap-0.5 px-4 py-1.5 rounded-xl text-on-surface-variant hover:bg-surface-container">
        <span class="material-symbols-outlined text-[22px]">home</span>
        <span class="text-[10px] font-semibold">Portal</span>
      </a>
      <a href="../minister_sunday_route_map/code.html" class="flex flex-col items-center justify-center gap-0.5 px-4 py-1.5 rounded-xl text-on-surface-variant hover:bg-surface-container">
        <span class="material-symbols-outlined text-[22px]">event_available</span>
        <span class="text-[10px] font-semibold">Visits</span>
      </a>
      <a href="./code.html" class="relative flex flex-col items-center justify-center gap-0.5 px-4 py-1.5 rounded-xl bg-primary-container text-white">
        <span class="material-symbols-outlined text-[22px]">mail</span>
        <span class="text-[10px] font-semibold">Inbox</span>
        <span data-unread-badge class="hidden absolute top-1 right-3 min-w-[16px] h-4 px-1 rounded-full bg-secondary-container text-on-secondary-fixed text-[9px] font-bold flex items-center justify-center"></span>
      </a>
      <a data-admin-only href="../admin_sunday_visit_roster/code.html" class="hidden flex flex-col items-center justify-center gap-0.5 px-3 py-1.5 rounded-xl text-on-surface-variant hover:bg-surface-container">
        <span class="material-symbols-outlined text-[22px]">admin_panel_settings</span>
        <span class="text-[10px] font-semibold">Admin</span>
      </a>
    </div>
  </nav>

  <script type="module">
    import {
      requireSession,
      applySessionUI,
      initNativeShell,
      registerPushNotifications,
      subscribeInbox,
      unreadMessages,
      markMessageRead,
      markAllMessagesRead,
      deleteMessage,
      formatDateTime,
      escapeHtml
    } from '../firebase-client.js';

    let session = null;
    let messages = [];
    let unsubscribe = null;

    function renderUnreadBadges() {
      const unread = unreadMessages(messages, session.user.uid).length;
      document.getElementById('unreadPill').textContent = unread ? `${unread} unread` : 'All read';
      document.getElementById('markAllBtn').classList.toggle('opacity-40', unread === 0);
      document.querySelectorAll('[data-unread-badge]').forEach((badge) => {
        badge.textContent = unread > 9 ? '9+' : String(unread);
        badge.classList.toggle('hidden', unread === 0);
      });
    }

    function renderMessages() {
      const list = document.getElementById('messageList');
      const empty = document.getElementById('emptyBox');

      if (!messages.length) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        renderUnreadBadges();
        return;
      }

      empty.classList.add('hidden');
      const uid = session.user.uid;
      const isAdmin = session.profile.role === 'admin';

      list.innerHTML = messages.map((message) => {
        const unread = message.senderUid !== uid && !(message.readBy || []).includes(uid);
        const audience = message.audience === 'all'
          ? 'All ministers'
          : `To ${escapeHtml(message.toName || 'minister')}`;
        const sent = message.createdAt?.toDate?.() || new Date();
        return `
          <details class="bg-white rounded-xl border ${unread ? 'border-secondary/50' : 'border-parchment-outline'} shadow-sm overflow-hidden" data-message-id="${escapeHtml(message.id)}">
            <summary class="list-none cursor-pointer p-4 flex items-start gap-3">
              <span class="w-9 h-9 rounded-full ${unread ? 'bg-secondary text-white' : 'bg-parchment-container text-primary'} flex items-center justify-center shrink-0">
                <span class="material-symbols-outlined text-lg">${unread ? 'mark_email_unread' : 'drafts'}</span>
              </span>
              <span class="min-w-0 flex-1">
                <span class="flex items-center justify-between gap-2">
                  <span class="text-sm font-semibold text-primary truncate">${escapeHtml(message.subject)}</span>
                  ${unread ? '<span class="w-2 h-2 rounded-full bg-secondary shrink-0"></span>' : ''}
                </span>
                <span class="block text-[11px] text-on-surface-variant truncate">${audience} · ${escapeHtml(message.senderName || 'Parish Office')}</span>
                <span class="block text-[10px] text-outline mt-0.5">${escapeHtml(formatDateTime(sent))}</span>
              </span>
              <span class="material-symbols-outlined text-outline shrink-0">expand_more</span>
            </summary>
            <div class="px-4 pb-4 pt-0">
              <div class="border-t border-parchment-outline pt-3 text-sm text-on-surface whitespace-pre-wrap leading-relaxed">${escapeHtml(message.body)}</div>
              <div class="flex items-center justify-between mt-3">
                <span class="text-[10px] text-outline">${message.audience === 'all' ? 'Sent to all ministers' : `Sent directly to ${escapeHtml(message.toName || 'a minister')}`}</span>
                ${isAdmin ? `<button type="button" data-delete-id="${escapeHtml(message.id)}" class="text-[11px] font-semibold text-error hover:underline flex items-center gap-0.5"><span class="material-symbols-outlined text-sm">delete</span>Delete</button>` : ''}
              </div>
            </div>
          </details>`;
      }).join('');

      list.querySelectorAll('details').forEach((details) => {
        details.addEventListener('toggle', async () => {
          if (!details.open) return;
          const id = details.dataset.messageId;
          const message = messages.find((item) => item.id === id);
          if (!message) return;
          if (message.senderUid === uid || (message.readBy || []).includes(uid)) return;
          try {
            await markMessageRead(id, uid);
          } catch (err) {
            console.warn('Could not mark message read:', err);
          }
        });
      });

      list.querySelectorAll('[data-delete-id]').forEach((button) => {
        button.addEventListener('click', async (event) => {
          event.preventDefault();
          const id = button.dataset.deleteId;
          if (!window.confirm('Delete this message for everyone?')) return;
          try {
            await deleteMessage(id);
          } catch (err) {
            console.error(err);
            alert('Could not delete this message.');
          }
        });
      });

      renderUnreadBadges();
    }

    document.getElementById('markAllBtn').addEventListener('click', async () => {
      if (!session) return;
      try {
        await markAllMessagesRead(messages, session.user.uid);
      } catch (err) {
        console.error(err);
        alert('Could not mark messages as read.');
      }
    });

    async function init() {
      session = await requireSession();
      if (!session) return;
      applySessionUI(session.profile);
      initNativeShell();
      registerPushNotifications(session.user);

      unsubscribe = subscribeInbox(session.user.uid, session.profile.role === 'admin', (items) => {
        messages = items;
        renderMessages();
      });
      window.addEventListener('beforeunload', () => unsubscribe?.());
    }

    init();
  </script>
</body>
</html>
