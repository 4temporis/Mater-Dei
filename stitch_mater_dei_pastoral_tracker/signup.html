<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b365d" />
  <title>Create Minister Account — Mater Dei Pastoral Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/tailwind.css" />
</head>
<body class="min-h-screen bg-parchment font-sans text-on-surface antialiased flex flex-col status-bar-scrim">
  <main class="flex-1 w-full max-w-md mx-auto px-5 pt-[calc(2rem_+_var(--safe-top))] pb-[calc(2rem_+_var(--safe-bottom))]">
    <a href="./login.html" class="inline-flex items-center gap-1 text-sm font-semibold text-primary mb-5">
      <span class="material-symbols-outlined text-lg">arrow_back</span>
      Back to sign in
    </a>

    <div class="text-center mb-6">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-secondary text-white flex items-center justify-center shadow-lg">
        <span class="material-symbols-outlined text-2xl">person_add</span>
      </div>
      <h1 class="font-serif text-2xl font-bold text-primary mt-3">Minister account</h1>
      <p class="text-sm text-on-surface-variant mt-1">Use the invitation code from the parish office to join your care team.</p>
    </div>

    <section class="bg-white rounded-2xl border border-[#E5DFD7] shadow-sm p-6">
      <div id="errorBox" class="hidden mb-4 p-3 rounded-lg bg-error-container text-on-error-container text-sm"></div>

      <form id="signupForm" class="space-y-4" novalidate>
        <div>
          <label for="code" class="block text-xs font-semibold text-on-surface-variant mb-1">Invitation code</label>
          <input id="code" name="code" type="text" autocomplete="one-time-code" required maxlength="12"
            class="w-full rounded-lg border border-[#E5DFD7] bg-parchment-container px-3 py-3 text-sm font-mono tracking-widest uppercase focus:border-primary focus:ring-primary"
            placeholder="ABCD2345" />
        </div>
        <div>
          <label for="name" class="block text-xs font-semibold text-on-surface-variant mb-1">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" required
            class="w-full rounded-lg border border-[#E5DFD7] bg-parchment-container px-3 py-3 text-sm focus:border-primary focus:ring-primary"
            placeholder="Mary Thomas" />
        </div>
        <div>
          <label for="email" class="block text-xs font-semibold text-on-surface-variant mb-1">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required
            class="w-full rounded-lg border border-[#E5DFD7] bg-parchment-container px-3 py-3 text-sm focus:border-primary focus:ring-primary"
            placeholder="you@example.com" />
        </div>
        <div>
          <label for="phone" class="block text-xs font-semibold text-on-surface-variant mb-1">Mobile number <span class="font-normal text-outline">(optional)</span></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel"
            class="w-full rounded-lg border border-[#E5DFD7] bg-parchment-container px-3 py-3 text-sm focus:border-primary focus:ring-primary"
            placeholder="+27 82 000 0000" />
        </div>
        <div>
          <label for="password" class="block text-xs font-semibold text-on-surface-variant mb-1">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6"
              class="w-full rounded-lg border border-[#E5DFD7] bg-parchment-container pl-3 pr-11 py-3 text-sm focus:border-primary focus:ring-primary"
              placeholder="At least 6 characters" />
            <button type="button" data-toggle-password="password" aria-label="Show password"
              class="absolute inset-y-0 right-0 w-11 flex items-center justify-center text-on-surface-variant hover:text-primary">
              <span class="material-symbols-outlined text-xl">visibility</span>
            </button>
          </div>
        </div>
        <div>
          <label for="confirm" class="block text-xs font-semibold text-on-surface-variant mb-1">Confirm password</label>
          <div class="relative">
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="6"
              class="w-full rounded-lg border border-[#E5DFD7] bg-parchment-container pl-3 pr-11 py-3 text-sm focus:border-primary focus:ring-primary"
              placeholder="Re-enter your password" />
            <button type="button" data-toggle-password="confirm" aria-label="Show password"
              class="absolute inset-y-0 right-0 w-11 flex items-center justify-center text-on-surface-variant hover:text-primary">
              <span class="material-symbols-outlined text-xl">visibility</span>
            </button>
          </div>
          <p class="mt-1 text-xs text-outline">Tap the eye icon to check what you typed before creating the account.</p>
        </div>

        <button id="submitBtn" type="submit"
          class="w-full h-12 rounded-lg bg-primary text-white font-semibold text-sm shadow active:scale-[0.98] transition-all flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-lg">check_circle</span>
          <span id="submitLabel">Create account</span>
        </button>
      </form>
    </section>

    <p class="text-center text-xs text-on-surface-variant mt-5">
      Already have an account? <a href="./login.html" class="font-semibold text-secondary hover:underline">Sign in</a>
    </p>
  </main>

  <script type="module">
    import { signUpWithInvite, waitForAuthUser, appUrl } from './firebase-client.js';

    const form = document.getElementById('signupForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');
    const submitLabel = document.getElementById('submitLabel');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove('hidden');
      errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.classList.add('hidden');

      const code = document.getElementById('code').value.trim().toUpperCase();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (!code || !name || !email || !password) {
        showError('Please complete the invitation code, name, email and password.');
        return;
      }
      if (password.length < 6) {
        showError('Your password must be at least 6 characters long.');
        return;
      }
      if (password !== confirm) {
        showError('The two passwords do not match.');
        return;
      }

      submitBtn.disabled = true;
      submitLabel.textContent = 'Creating account…';

      try {
        await signUpWithInvite({ name, email, password, phone, code });
        window.location.replace(appUrl('index.html?welcome=1'));
      } catch (err) {
        console.error(err);
        const message = String(err?.message || '');
        if (message.includes('invitation code')) {
          showError(message);
        } else if (err?.code === 'auth/email-already-in-use') {
          showError('An account already exists for this email address. Try signing in instead.');
        } else if (err?.code === 'auth/weak-password') {
          showError('Please choose a stronger password (at least 6 characters).');
        } else if (err?.code === 'auth/invalid-email') {
          showError('That email address does not look valid.');
        } else if (err?.code === 'permission-denied' || message.includes('Missing or insufficient permissions')) {
          showError('That invitation code is not valid. Please check the code with the parish office.');
        } else if (err?.code === 'auth/configuration-not-found' || err?.code === 'auth/operation-not-allowed') {
          showError('Sign-up is not enabled on the parish Firebase project yet. Enable Email/Password in the Firebase console, then try again.');
        } else {
          showError(message || 'Could not create your account. Please try again.');
        }
        submitBtn.disabled = false;
        submitLabel.textContent = 'Create account';
      }
    });

    waitForAuthUser().then((user) => {
      if (user) window.location.replace(appUrl('index.html'));
    });

    document.querySelectorAll('[data-toggle-password]').forEach((button) => {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.togglePassword);
        const reveal = input.type === 'password';
        input.type = reveal ? 'text' : 'password';
        const icon = button.querySelector('.material-symbols-outlined');
        if (icon) icon.textContent = reveal ? 'visibility_off' : 'visibility';
        button.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
      });
    });
  </script>
</body>
</html>
